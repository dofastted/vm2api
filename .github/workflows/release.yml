# Publish linux amd64 binaries from git (prebuilt kernel; Go still built here).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: build
        run: |
          mkdir -p dist
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-worker ./cmd/kin-worker)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-egress ./cmd/kin-egress)
          test -x bin/kin-kernel && cp bin/kin-kernel dist/kin-kernel
          test -x bin/kin-codex-kernel && cp bin/kin-codex-kernel dist/kin-codex-kernel
          test -x bin/kin-cookie-auth && cp bin/kin-cookie-auth dist/kin-cookie-auth
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/kin-kernel
            dist/kin-codex-kernel
            dist/kin-worker
            dist/kin-egress
            dist/kin-cookie-auth
