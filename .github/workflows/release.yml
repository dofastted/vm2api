# Publish linux amd64 binaries from git (prebuilt kernel; Go still built here).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: build
        run: |
          mkdir -p dist
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-worker ./cmd/kin-worker)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-egress ./cmd/kin-egress)
          chmod a+x bin/kin-kernel bin/kin-codex-kernel bin/kin-cookie-auth
          cp bin/kin-kernel bin/kin-codex-kernel bin/kin-cookie-auth dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: false
          name: vm2api ${{ github.ref_name }}
          body: |
            仓内预编译 linux amd64 二进制，clone / compose 即可部署，不必在服务器上编 kernel 与 wrap CLI。

            升级见 [CHANGELOG.md](https://github.com/dofastted/vm2api/blob/main/CHANGELOG.md) 与 [docs/DEPLOY.md](https://github.com/dofastted/vm2api/blob/main/docs/DEPLOY.md)。
          files: |
            dist/kin-kernel
            dist/kin-codex-kernel
            dist/kin-worker
            dist/kin-egress
            dist/kin-cookie-auth
