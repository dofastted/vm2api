# Publish linux binaries and the control-plane images.
# Assets: unsuffixed names are linux amd64 (deployed panels download them by
# exact name); native ARM64 helpers carry a `-linux-arm64` suffix.
# Images: `<ref>-amd64` and `<ref>-arm64` are single-arch; `<ref>` (and
# `latest` on tags) is a manifest list over both.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${GITHUB_REF_NAME} points at a commit not on main" >&2
            exit 1
          }
      - name: verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          }
      - name: stage pinned payload
        run: |
          # Every amd64 asset, Go helpers included, is the pinned production build.
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --stage dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: false
          fail_on_unmatched_files: true
          name: vm2api ${{ github.ref_name }}
          body: |
            无后缀附件为 linux amd64；`-linux-arm64` 后缀为 ARM64 控制面原生 helper。槽位 kernel / CLI 只有 amd64，ARM64 主机经 QEMU 运行。
            控制面镜像：`ghcr.io/dofastted/vm2api:${{ github.ref_name }}`（多架构，ARM64 构建未通过时只含 amd64），`${{ github.ref_name }}-amd64` / `${{ github.ref_name }}-arm64`（单架构）。一键脚本按宿主架构自动选择。

            升级见 [CHANGELOG.md](https://github.com/dofastted/vm2api/blob/main/CHANGELOG.md)、[docs/DEPLOY.md](https://github.com/dofastted/vm2api/blob/main/docs/DEPLOY.md) 与 [docs/ARM64.md](https://github.com/dofastted/vm2api/blob/main/docs/ARM64.md)。
          files: dist/*

  image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image reference
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref=edge
          if [ "${{ github.ref_type }}" = "tag" ]; then ref="${GITHUB_REF_NAME}"; fi
          echo "image=ghcr.io/${owner}/vm2api:${ref}-amd64" >> "$GITHUB_OUTPUT"
      - name: control plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=vm2api
          cache-to: type=gha,scope=vm2api,mode=max,ignore-error=true

  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    needs: linux-amd64
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 QEMU handler for the smoke test
        run: |
          python3 deploy/prepare-arm64.py
          python3 deploy/prepare-arm64.py --check
      - name: resolve image reference
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref=edge
          if [ "${{ github.ref_type }}" = "tag" ]; then ref="${GITHUB_REF_NAME}"; fi
          echo "image=ghcr.io/${owner}/vm2api:${ref}-arm64" >> "$GITHUB_OUTPUT"
      - name: build native control plane
        run: docker build --progress=plain --platform linux/arm64 -f deploy/Dockerfile.arm64-control -t "${{ steps.meta.outputs.image }}" .
      - name: verify native runtime and emulated payloads
        run: python3 test/deploy/smoke_arm64_image.py "${{ steps.meta.outputs.image }}"
      - name: extract native helpers as release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-arm64
          cid=$(docker create --platform linux/arm64 "${{ steps.meta.outputs.image }}")
          trap 'docker rm "$cid" >/dev/null' EXIT
          for name in kin-worker kin-egress; do
            docker cp "$cid:/opt/vm2api/image-bin/$name" "dist-arm64/$name-linux-arm64"
          done
          python3 - dist-arm64/*-linux-arm64 <<'PY'
          import struct, sys
          for path in sys.argv[1:]:
              data = open(path, 'rb').read(64)
              assert data[:6] == b'\x7fELF\x02\x01', path
              assert struct.unpack_from('<H', data, 18)[0] == 183, f'{path} is not AArch64'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: dist-arm64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push image
        run: docker push "${{ steps.meta.outputs.image }}"
      - name: attach ARM64 assets to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist-arm64/kin-worker-linux-arm64 dist-arm64/kin-egress-linux-arm64 --clobber

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [image-amd64, image-arm64]
    # amd64 推成功就发布 `<ref>` 与 `latest`；ARM64 失败时降级为 amd64 单架构，
    # 否则这两个 tag 会一直停在上一次两架构都通过的版本上。ARM64 主机由一键脚本
    # 固定写 `-arm64` 单架构 tag（见 docs/ARM64.md），不依赖这里的多架构 tag。
    if: ${{ !cancelled() && needs.image-amd64.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: publish multi-arch tags
        shell: bash
        env:
          ARM64_RESULT: ${{ needs.image-arm64.result }}
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/vm2api"
          ref=edge
          targets=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ref="${GITHUB_REF_NAME}"
            targets+=(-t "${image}:latest")
          fi
          targets+=(-t "${image}:${ref}")
          sources=("${image}:${ref}-amd64")
          expected=amd64
          if [ "${ARM64_RESULT}" = "success" ]; then
            sources+=("${image}:${ref}-arm64")
            expected="amd64 arm64"
          else
            echo "::warning title=ARM64 image missing::image-arm64 结果为 ${ARM64_RESULT}，${ref} 与 latest 本次只含 amd64；ARM64 主机请拉 ${ref}-arm64"
          fi
          docker buildx imagetools create "${targets[@]}" "${sources[@]}"
          docker buildx imagetools inspect --raw "${image}:${ref}" | EXPECTED="${expected}" python3 -c '
          import json, os, sys
          expected = set(os.environ["EXPECTED"].split())
          found = {(m.get("platform") or {}).get("architecture") for m in json.load(sys.stdin).get("manifests", [])}
          missing = expected - found
          assert not missing, f"manifest list lacks {sorted(missing)}"
          print("manifest platforms:", sorted(p for p in found if p))
          '
          printf '%s\n' "多架构 tag \`${ref}\`（tag 推送时同时更新 \`latest\`）架构：${expected// /, }" >> "$GITHUB_STEP_SUMMARY"
