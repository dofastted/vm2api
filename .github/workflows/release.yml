# Publish linux amd64 binaries and the control-plane image.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: worker/go.sum
      - name: verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          }
      - name: build
        run: |
          mkdir -p dist
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-worker ./cmd/kin-worker)
          (cd worker && CGO_ENABLED=0 go build -trimpath -o ../dist/kin-egress ./cmd/kin-egress)
          (cd codex-kernel && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/kin-codex-kernel .)
          chmod a+x bin/kin-kernel bin/kin-codex-kernel bin/kin-oauth-auth share/wrap-cli/cli-node share/wrap-cli/cc-node share/crag/kin-kernel
          cp bin/kin-kernel bin/kin-oauth-auth share/wrap-cli/cli-node share/wrap-cli/cc-node dist/
          cp share/crag/kin-kernel dist/kin-kernel-crag
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: false
          fail_on_unmatched_files: true
          name: vm2api ${{ github.ref_name }}
          body: |
            仓内预编译 linux amd64 二进制，clone / compose 即可部署，不必在服务器上编 kernel 与 wrap CLI。

            升级见 [CHANGELOG.md](https://github.com/dofastted/vm2api/blob/main/CHANGELOG.md) 与 [docs/DEPLOY.md](https://github.com/dofastted/vm2api/blob/main/docs/DEPLOY.md)。
          files: |
            dist/kin-kernel
            dist/kin-kernel-crag
            dist/kin-codex-kernel
            dist/kin-worker
            dist/kin-egress
            dist/kin-oauth-auth
            dist/cli-node
            dist/cc-node

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: linux-amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: dist
      - name: install freshly built Go binaries for the image
        run: install -m 755 dist/kin-worker dist/kin-egress dist/kin-codex-kernel bin/
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=ghcr.io/${owner}/vm2api:v${version},ghcr.io/${owner}/vm2api:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner}/vm2api:edge" >> "$GITHUB_OUTPUT"
          fi
      - name: control plane image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=vm2api
          cache-to: type=gha,scope=vm2api,mode=max
