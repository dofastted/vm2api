# Daily CI checks core behavior in changed components. Full regression and
# native ARM packaging remain explicit manual checks, independent of PRs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all unit/web tests and formatting checks
        type: boolean
        default: false
      arm64:
        description: Build and smoke-test the native ARM image
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      go: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      packaging: ${{ inputs.full || steps.filter.outputs.packaging == 'true' }}
      unit_tests: ${{ steps.filter.outputs.unit_tests_files || '[]' }}
      web_tests: ${{ steps.filter.outputs.web_tests_files || '[]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          list-files: json
          filters: |
            backend:
              - 'src/**'
              - 'test/unit/**'
              - 'test/fixtures/**'
              - 'test/harness.mjs'
              - 'scripts/**/*.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'pnpm-lock.yaml'
              - 'biome.json'
              - '.github/workflows/test.yml'
            go:
              - 'worker/**'
              - 'api-kernel/**'
              - 'redact/**'
              - '.github/workflows/test.yml'
            web:
              - 'web/**'
              - '.github/workflows/test.yml'
            packaging:
              - 'deploy/**'
              - 'docker/**'
              - 'share/**'
              - 'scripts/docker-entrypoint.sh'
              - 'scripts/fetch-payload.mjs'
              - 'test/deploy/**'
              - '.github/workflows/test.yml'
            unit_tests:
              - added|modified: 'test/unit/*.test.mjs'
            web_tests:
              - added|modified: 'web/src/**/*.test.ts'
              - added|modified: 'web/src/**/*.test.tsx'

  ci:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: require change classification
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packaging == 'true'
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packaging == 'true')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.packaging == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        if: needs.changes.outputs.backend == 'true'
      - uses: actions/setup-go@v7
        if: needs.changes.outputs.go == 'true' || inputs.full
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
            redact/go.sum
      - name: pinned payload
        if: needs.changes.outputs.packaging == 'true'
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - name: native CLI packaging unit tests
        if: needs.changes.outputs.packaging == 'true'
        run: python3 -m unittest discover -s test/deploy -p test_native_cli.py -v
      - name: backend syntax
        if: needs.changes.outputs.backend == 'true'
        run: find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: backend tests
        if: needs.changes.outputs.backend == 'true'
        env:
          FULL: ${{ inputs.full }}
          CHANGED_TESTS: ${{ needs.changes.outputs.unit_tests }}
        run: |
          if [ "$FULL" = true ]; then
            npm run test:unit
          else
            tests=$(jq -r '.[] | split("/")[-1]' <<< "$CHANGED_TESTS")
            changed=()
            if [ -n "$tests" ]; then
              mapfile -t changed <<< "$tests"
            fi
            npm run test:ci -- "${changed[@]}"
          fi
      - name: Go tests
        if: needs.changes.outputs.go == 'true'
        run: |
          (cd worker && go test ./...)
          (cd api-kernel && go test ./...)
          (cd redact && go test ./...)
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.web == 'true'
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: web tests and build
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        env:
          FULL: ${{ inputs.full }}
          CHANGED_TESTS: ${{ needs.changes.outputs.web_tests }}
        run: |
          pnpm install --frozen-lockfile
          if [ "$FULL" = true ]; then
            pnpm test
          else
            tests=$(jq -r '.[] | ltrimstr("web/")' <<< "$CHANGED_TESTS")
            changed=()
            if [ -n "$tests" ]; then
              mapfile -t changed <<< "$tests"
            fi
            pnpm test:ci "${changed[@]}"
          fi
          pnpm build
      - name: full formatting checks
        if: inputs.full
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel redact)" || { gofmt -l worker api-kernel redact; exit 1; }
          pnpm -C web format:check

  arm64-native-cli:
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 kernel emulation
        run: python3 deploy/prepare-arm64.py
      - name: build native ARM control plane
        run: docker build -f deploy/Dockerfile.arm64-control -t vm2api-native-cli-ci .
      - name: offline large-body, concurrency and cancel regression
        run: |
          docker run --network none --cpus 2 --memory 3g --pids-limit 256 \
            --entrypoint python3 -v "$PWD/test/deploy/smoke_native_cli.py:/smoke.py:ro" \
            vm2api-native-cli-ci /smoke.py
