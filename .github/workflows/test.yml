# PR/main gate against the production baseline: deploy/payload.json pins the
# exact ELFs running live, so CI only checks source and the pinned bytes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only PR runs supersede each other; every main push keeps its own verdict so
# it is visible when main turned red and when it recovered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            docs:
              - 'README.md'
              - 'CHANGELOG.md'
              - 'docs/**'
              - 'VERSION'
            non_docs:
              - '**'
              - '!README.md'
              - '!CHANGELOG.md'
              - '!docs/**'
              - '!VERSION'
      - id: classify
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.docs }}" = "true" ] && [ "${{ steps.filter.outputs.non_docs }}" != "true" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  ci-lite:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: format and syntax
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel)" || { gofmt -l worker api-kernel; exit 1; }
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

  ci-prep:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: format and syntax
        run: |
          npx biome format
          test -z "$(gofmt -l worker api-kernel)" || { gofmt -l worker api-kernel; exit 1; }
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: pinned payload
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - name: native CLI packaging unit tests
        run: python3 -m unittest discover -s test/deploy -p test_native_cli.py -v

  ci-unit:
    needs: [changes, ci-prep]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: redact/go.sum
      - name: stage pinned runtime helpers for unit tests
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
      - run: npm run test:unit

  ci-go:
    needs: [changes, ci-prep]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - name: go vet and test
        run: |
          (cd worker && go vet ./... && go test ./...)
          (cd api-kernel && go vet ./... && go test ./...)

  ci-web:
    needs: [changes, ci-prep]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: merge current base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build

  arm64-native-cli:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 kernel emulation
        run: python3 deploy/prepare-arm64.py
      - name: build native ARM control plane
        run: docker build -f deploy/Dockerfile.arm64-control -t vm2api-native-cli-ci .
      - name: offline large-body, concurrency and cancel regression
        run: |
          docker run --network none --cpus 2 --memory 3g --pids-limit 256 \
            --entrypoint python3 -v "$PWD/test/deploy/smoke_native_cli.py:/smoke.py:ro" \
            vm2api-native-cli-ci /smoke.py
