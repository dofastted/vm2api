# PR/main gate: Node + both Go modules + prebuilt linux amd64 ELFs + web.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: format-check
        run: npx biome format
      - name: syntax-check Node source and scripts
        run: |
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm run test:unit

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l worker api-kernel codex-kernel)
          if [ -n "$files" ]; then
            printf 'gofmt needed:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: go test race
        run: |
          (cd worker && go test -race ./...)
          (cd api-kernel && go test -race ./...)
          (cd codex-kernel && go test -race ./...)
      - name: go vet
        run: |
          (cd worker && go vet ./...)
          (cd api-kernel && go vet ./...)
          (cd codex-kernel && go vet ./...)
      - name: build Go commands
        run: |
          (cd worker && CGO_ENABLED=0 go build -trimpath ./cmd/...)
          (cd api-kernel && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kin-api-kernel" ./cmd/kin-api-kernel)
          (cd codex-kernel && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/kin-codex-kernel" .)

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: prebuilt linux amd64 ELFs
        run: |
          for b in bin/kin-kernel bin/kin-egress bin/kin-worker bin/kin-codex-kernel bin/kin-oauth-auth share/wrap-cli/kin-kernel.bin share/wrap-cli/cli-node share/wrap-cli/cc-node share/crag/kin-kernel; do
            test -f "$b"
            file "$b" | grep -q 'ELF 64-bit LSB .*x86-64'
          done
          cmp bin/kin-kernel share/wrap-cli/kin-kernel.bin

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: install and verify
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build
