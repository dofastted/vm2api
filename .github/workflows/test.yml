# PR/main gate: Node + Go + pinned amd64 payload ELFs + web + native ARM64 deployment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: vm2api
          POSTGRES_PASSWORD: vm2api-ci-test
          POSTGRES_DB: vm2api_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vm2api -d vm2api_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      VM2API_TEST_DATABASE_URL: postgresql://vm2api:vm2api-ci-test@127.0.0.1:5432/vm2api_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: worker/go.sum
      - name: Keep disposable database cleanup immediate
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U vm2api -d vm2api_test -v ON_ERROR_STOP=1 -c 'ALTER SYSTEM SET checkpoint_completion_target=0' -c 'SELECT pg_reload_conf()'
      - run: npm ci
      - name: PostgreSQL 17 backup clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: panel user and onboarding regression tests
        run: node --import ./test/pg-setup.mjs --test test/unit/panel-users.test.mjs test/unit/onboarding.test.mjs test/e2e/panel-users.e2e.test.mjs
      - name: format-check
        run: npx biome format
      - name: syntax-check Node source and scripts
        run: |
          find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: slot payloads and egress helper used by the unit tests
        run: |
          npm run fetch:payload
          npm run build:egress
      - run: npm run test:unit
      - run: npm run test:e2e
      - name: ARM64 host preparation and rollback tests
        run: python3 -m unittest discover -s test/deploy -v
      - name: PostgreSQL application role permissions
        run: python3 test/deploy/smoke_postgres_role.py

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: prepare pinned x86 QEMU handler
        run: |
          python3 deploy/prepare-arm64.py
          python3 deploy/prepare-arm64.py --check
          python3 deploy/prepare-arm64.py
      - name: verify real kernel rollback on the disposable runner
        run: python3 test/deploy/smoke_binfmt_restore.py
      - name: validate ARM64 Compose configuration
        run: |
          python3 deploy/init-arm64-env.py --port 18787 --container-name vm2api-arm64-ci
          docker compose -f docker-compose.yml -f docker-compose.arm64.yml config --quiet
      - name: build native control plane
        run: docker build --progress=plain --platform linux/arm64 -f deploy/Dockerfile.arm64-control -t vm2api-arm64-control:ci .
      - name: verify native runtime and emulated payloads
        run: python3 test/deploy/smoke_arm64_image.py vm2api-arm64-control:ci
      - name: build and verify a different checkout VERSION
        run: |
          trap 'git restore -- VERSION' EXIT
          python3 -c 'from pathlib import Path; p = Path("VERSION"); p.write_text(p.read_text().strip() + "-arm64-build-check\n")'
          docker build --progress=plain --platform linux/arm64 -f deploy/Dockerfile.arm64-control -t vm2api-arm64-control:ci-version .
          python3 test/deploy/smoke_arm64_image.py vm2api-arm64-control:ci-version

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            worker/go.sum
            api-kernel/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l worker api-kernel)
          if [ -n "$files" ]; then
            printf 'gofmt needed:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: go test race
        run: |
          (cd worker && go test -race ./...)
          (cd api-kernel && go test -race ./...)
      - name: go vet
        run: |
          (cd worker && go vet ./...)
          (cd api-kernel && go vet ./...)
      - name: build Go commands
        run: |
          (cd worker && CGO_ENABLED=0 go build -trimpath ./cmd/...)
          (cd api-kernel && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/kin-api-kernel" ./cmd/kin-api-kernel)

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: pinned linux amd64 payload ELFs
        run: |
          node scripts/fetch-payload.mjs
          node scripts/fetch-payload.mjs --check
          for b in bin/kin-kernel bin/kin-codex-kernel bin/kin-oauth-auth share/wrap-cli/kin-kernel.bin share/wrap-cli/cli-node share/wrap-cli/cc-node share/crag/kin-kernel; do
            file "$b" | grep -q 'ELF 64-bit LSB .*x86-64'
          done

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
      - name: install and verify
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm test
          pnpm build
