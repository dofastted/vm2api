# Guest OS layers change independently of application releases.
name: guest-images

on:
  push:
    branches: [main]
    paths:
      - 'docker/kin-os/**'
      - 'docker/kin-kvm/**'
      - 'docker/kin-desktop/**'
      - '.github/workflows/guest-images.yml'
  workflow_dispatch:
    inputs:
      build_custom_kernel:
        description: 'Build pinned Debian 13 Linux 6.12 LTS custom KVM kernel (vmlinuz-custom + initrd.img-custom)'
        required: false
        type: boolean
        default: false

concurrency:
  group: guest-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: ubuntu-24.04
            image: ubuntu:24.04
          - directory: debian-12
            image: debian:12
          - directory: archlinux
            image: arch:latest
          - directory: fedora-41
            image: fedora:41
          - directory: debian-13
            image: debian:13-baked
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tag
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "tag=ghcr.io/${REPOSITORY_OWNER,,}/kin-os-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: build and push guest image
        uses: docker/build-push-action@v7
        with:
          context: docker/kin-os/${{ matrix.directory }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=kin-os-${{ matrix.directory }}
          cache-to: type=gha,scope=kin-os-${{ matrix.directory }},mode=max

  # Optional slot desktop companion (src/lib/vm/slot-desktop.mjs DESKTOP_IMAGE).
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tag
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "tag=ghcr.io/${REPOSITORY_OWNER,,}/kin-desktop:debian-12" >> "$GITHUB_OUTPUT"
      - name: build and push desktop image
        uses: docker/build-push-action@v7
        with:
          context: docker/kin-desktop
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=kin-desktop
          cache-to: type=gha,scope=kin-desktop,mode=max

  # URLs must match src/lib/vm/os-catalog.mjs kvm.cloud_image.
  kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: ubuntu
            tag: '24.04'
            cloud_image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
          - family: debian
            tag: '12'
            cloud_image: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2
          - family: arch
            tag: latest
            cloud_image: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
          - family: fedora
            tag: '41'
            cloud_image: https://download.fedoraproject.org/pub/archive/fedora/linux/releases/41/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-41-1.4.x86_64.qcow2
          - family: debian
            tag: '13'
            cloud_image: ''
            skip_cloud_image: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tag
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          FAMILY: ${{ matrix.family }}
          TAG: ${{ matrix.tag }}
        run: echo "tag=ghcr.io/${REPOSITORY_OWNER,,}/kin-kvm-${FAMILY}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: build and push kvm runner
        uses: docker/build-push-action@v7
        with:
          context: docker/kin-kvm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            CLOUD_IMAGE_URL=${{ matrix.cloud_image }}
            SKIP_CLOUD_IMAGE=${{ matrix.skip_cloud_image || '0' }}
          cache-from: type=gha,scope=kin-kvm-${{ matrix.family }}-${{ matrix.tag }}
          cache-to: type=gha,scope=kin-kvm-${{ matrix.family }}-${{ matrix.tag }},mode=max

  # Optional Phase B pinned Linux 6.12 LTS custom KVM kernel (opt-in via workflow_dispatch).
  custom-kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.build_custom_kernel == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: build pinned Debian 13 6.12 LTS custom kernel
        run: bash scripts/build-custom-debian13-kernel.sh --out-dir "${{ runner.temp }}/custom-kernel-out"
      - name: verify custom kernel artifacts
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/custom-kernel-out"
          ls -la vmlinuz-custom initrd.img-custom SHA256SUMS kernel-build-meta.json
          sha256sum -c SHA256SUMS
      - name: archive custom kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crag-debian13-custom-kernel-amd64
          path: |
            ${{ runner.temp }}/custom-kernel-out/vmlinuz-custom
            ${{ runner.temp }}/custom-kernel-out/initrd.img-custom
            ${{ runner.temp }}/custom-kernel-out/SHA256SUMS
            ${{ runner.temp }}/custom-kernel-out/kernel-build-meta.json
          if-no-files-found: error
          retention-days: 30
