apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm2api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vm2api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm2api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-state
          image: ghcr.io/dofastted/vm2api:kubernetes-draft
          command: [node, -e]
          args:
            - "const fs=require('node:fs');for(const dir of ['vms','data','config'])fs.mkdirSync('/state/'+dir,{recursive:true,mode:0o700})"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: control-plane
          image: ghcr.io/dofastted/vm2api:kubernetes-draft
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: vm2api-config
          env:
            - name: VM2API_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vm2api-secrets
                  key: VM2API_DATABASE_URL
            - name: VM2API_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vm2api-secrets
                  key: VM2API_ADMIN_PASSWORD
            - name: VM2API_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vm2api-secrets
                  key: VM2API_API_KEY
            - name: VM2API_DB_SECRET
              valueFrom:
                secretKeyRef:
                  name: vm2api-secrets
                  key: VM2API_DB_SECRET
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /opt/vm2api/vms
              subPath: vms
            - name: state
              mountPath: /opt/vm2api/data
              subPath: data
            - name: state
              mountPath: /opt/vm2api/src/config
              subPath: config
            - name: run
              mountPath: /opt/vm2api/data/run
            - name: bin
              mountPath: /opt/vm2api/bin
            - name: share
              mountPath: /opt/vm2api/share
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: vm2api-state
        - name: run
          emptyDir: {}
        - name: bin
          emptyDir: {}
        - name: share
          emptyDir: {}
