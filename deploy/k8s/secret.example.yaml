# Example only; not included by kustomization.yaml. Create the real Secret from a protected env file.
apiVersion: v1
kind: Secret
metadata:
  name: vm2api-secrets
type: Opaque
stringData:
  VM2API_DATABASE_URL: REPLACE_WITH_DATABASE_URL
  VM2API_ADMIN_PASSWORD: REPLACE_WITH_ADMIN_PASSWORD
  VM2API_API_KEY: REPLACE_WITH_API_KEY
  # Required for Kubernetes PKCE sessions. All replicas must retain the same existing business encryption key.
  VM2API_DB_SECRET: REPLACE_WITH_EXISTING_BUSINESS_ENCRYPTION_KEY
