apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm2api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vm2api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: control-plane
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: state
              mountPath: /opt/vm2api/vms
              subPath: vms
            - name: state
              mountPath: /opt/vm2api/data
              subPath: data
            - name: state
              mountPath: /opt/vm2api/src/config
              subPath: config
            - name: run
              mountPath: /opt/vm2api/data/run
            - name: bin
              $patch: delete
            - name: share
              $patch: delete
            - name: node-trust
              mountPath: /etc/vm2api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim: null
          emptyDir: {}
        - name: bin
          $patch: delete
        - name: share
          $patch: delete
        - name: node-trust
          secret:
            secretName: vm2api-node-trust
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
