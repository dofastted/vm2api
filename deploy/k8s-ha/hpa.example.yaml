# Optional. Install metrics-server and reserve one extra node above maxReplicas for rolling updates.
# Do not manage spec.replicas with kubectl apply after enabling this HPA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vm2api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vm2api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
