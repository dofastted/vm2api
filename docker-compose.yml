# 控制面容器 + 宿主机 Docker 管槽位。
# 镜像直接拉取，不在用户机器上构建；仓库目录不再限定 /opt/vm2api：
# 槽容器的 -v 源路径由控制面自省 `docker inspect vm2api` 的 Mounts 换算成宿主路径。
# 本地开发要构建镜像：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  vm2api:
    image: ${VM2API_IMAGE:-ghcr.io/dofastted/vm2api}:${VM2API_IMAGE_TAG:-latest}
    container_name: ${VM2API_CONTAINER_NAME:-vm2api}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    environment:
      KIN_PROJECT_ROOT: /opt/vm2api
      KIN_DATA_DIR: /opt/vm2api/data
      VM2API_DATABASE_URL: ${VM2API_DATABASE_URL:-${KIN_DATABASE_URL:-postgresql://vm2api:${VM2API_POSTGRES_PASSWORD:-}@127.0.0.1:${VM2API_POSTGRES_PORT:-55432}/vm2api}}
      KIN_KERNEL_BIN: /opt/vm2api/bin/kin-kernel
      KIN_EGRESS_BIN: /opt/vm2api/bin/kin-egress
      KIN_WORKER_BIN: /opt/vm2api/bin/kin-worker
      KIN_CODEX_KERNEL_BIN: /opt/vm2api/bin/kin-codex-kernel
      KIN_OAUTH_AUTH_BIN: /opt/vm2api/bin/kin-oauth-auth
      KIN_COMPUTER_BIN: ${KIN_COMPUTER_BIN:-/opt/vm2api/bin/kin-computer}
      KIN_AUTO_SYNC_WRAP: ${KIN_AUTO_SYNC_WRAP:-1}
      # 自省容器名；VM2API_HOST_ROOT 可显式覆盖宿主安装目录。
      VM2API_CONTAINER_NAME: ${VM2API_CONTAINER_NAME:-vm2api}
      VM2API_HOST_ROOT: ${VM2API_HOST_ROOT:-}
      HOST: 0.0.0.0
      PORT: ${PORT:-8787}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./vms:/opt/vm2api/vms
      - ./data:/opt/vm2api/data
      - ./bin:/opt/vm2api/bin
      - ./share:/opt/vm2api/share
      - ./src/config:/opt/vm2api/src/config

  postgres:
    image: postgres:17-bookworm
    profiles: [postgres]
    restart: unless-stopped
    entrypoint: [/bin/bash, /usr/local/bin/vm2api-postgres-entrypoint]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      VM2API_POSTGRES_PASSWORD: ${VM2API_POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:${VM2API_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-entrypoint.sh:/usr/local/bin/vm2api-postgres-entrypoint:ro
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-vm2api.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vm2api -d vm2api && psql -U vm2api -d vm2api -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
